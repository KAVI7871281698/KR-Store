{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Store - Order Form</title>
    <!-- <link rel="stylesheet" href="{% static 'order.css' %}"> -->
</head>
<body>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(270deg, #ff7e5f, #feb47b, #ffedbc, #2193b0, #6dd5ed);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Animated background */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.9);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 90%;
    max-width: 400px;
    animation: fadeIn 1s ease-in-out;
}

/* Fade-in animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    display: block;
    padding-top: 5px;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    background-color: #28a745;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border: none;
    transition: background 0.3s, transform 0.2s;
}

/* Button hover animation */
button:hover {
    background-color: #218838;
    transform: scale(1.05);
}

.qr-code {
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

.qr-code img {
    width: 150px;
    height: 150px;
}

@media (max-width: 500px) {
    .container {
        width: 95%;
    }
}
    </style>
    <div class="container">
        <h1>{{ ordered.name }}</h1> 
        <form method="POST" action="/order_confirm/{{ ordered.id }}/" enctype="multipart/form-data">
            {% csrf_token %} 
            <label for="product">Product Name</label>
            <h6>{{ ordered.product.product_name }}</h6>
            
            <label for="quantity">Quantity</label>
            <h6>{{ ordered.quantity }}</h6>
            
            <label for="price">Price</label>
            <h6>{{ ordered.product.price }}</h6>
            
            <label for="total">Total Price</label>
            <h6>{{ ordered.total_price }}</h6>
            
            <label for="date">Date</label>
            <h6>{{ ordered.order_date }}</h6>

            <label for="date">Payment mode</label>
            <h6>Only Cash On Delivery</h6>
            
            <label for="address">Address</label>
            <input type="text" id="address" class="address" name="address" placeholder="Enter address" required>
           <button type="submit">Place the Order</button>
            <!-- <a href="/create_order">Click</a> -->
        </form>
    </div>
</body>
</html>
