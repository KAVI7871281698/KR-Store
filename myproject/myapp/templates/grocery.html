{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Store</title>
    <link rel="stylesheet" href="{% static 'demart.css' %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home_page.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<style>
    .logo {
        font-family: "Poppins", sans-serif;
        font-weight: 900;
        font-style: italic;
        color: black;
    }
</style>
<body>
    <div class="section1">
            <nav class="navbar">
                <div class="logo">KR Store</div>
              <!-- <div class="searchbar">
                <input type="text" id="search" name="search" placeholder="  Search" class="inputsearch">
                <button type="submit" class="inputbutton">Search</button>
              </div> -->
              <ul class="nav-links">
                <li class="category"><a href="/product">Furits</a></li>
                <li class="category"><a href="/vegtables">Vegtables</a></li>
                <li class="category"><a href="/grocery">Grocery</a></li>
                <li><a href="/add_to_cart"> <img src="{% static 'img/cart logo.png' %}" style="width: 50px; ">
                </a></li>
              </ul>
              <div class="hamburger" onclick="toggleMenu()">
                &#9776;
              </div>
            </nav>
          <script src="{% static 'exam.js' %}"></script>
    </div>

    <div class="section2">
        {% for i in see %}
        <div class="products">
            <img src="{{ i.demart_img.url }}" class="productitems"><br>
            <span class="productname">{{ i.brand_name }}</span><br>
            <span class="productname">{{ i.product_id }}</span><br>
            <span class="productname">{{ i.product_name }}</span><br>
            <span class="price">{{ i.category }}</span><br>
            <span class="price">Stock-{{ i.stock }}</span><br>
            <span class="price">Price-{{ i.price }}</span><br>
            <a href="/cart/{{ i.id }}/"><button type="submit" class="cart">🛒 ADD TO CART</button></a>
        </div>
        {% endfor %}
        
</body>
</html>
