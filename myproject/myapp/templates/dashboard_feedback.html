{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Store -Dashboard</title>
    <link rel="stylesheet" href="{% static 'report.css' %}">
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/dashboard_order">Orders</a></li>
            <li><a href="/dashboard_product">Products</a></li>
            <li><a href="/dashboard_customer">Customers</a></li>
            <li><a href="/report">Reports</a></li>
            <li><a href="/dashboard_feedback">Feeback</a></li>
            <!-- <li><a href="/admin_loggout">Logout</a></li> -->
            <!-- <li><a href="/setting">Settings</a></li> -->
        </ul>
    </div>
    <div class="main-content">
        <header>
            <h1>Customer Feedbacks</h1>
        </header>
        <section class="table">
            <table>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Feedback</th>
                </tr>
                {% for i in datas %}
                <tr>
                    <td>{{ i.name }}</td>
                    <td>{{ i.email }}</td>
                    <td>{{ i.feedback }}</td>
                </tr>
                {% endfor %}
            </table>
        </section>
    </div>
</body>
</html>
